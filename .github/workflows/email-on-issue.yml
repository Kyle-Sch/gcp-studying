name: Email on New Issue
on:
  issues:
    types: [opened]
jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          python3 - <<'EOF'
          import os, json, subprocess
          payload = {
            "from": "onboarding@resend.dev",
            "to": ["kyle.schne@gmail.com"],
            "subject": os.environ["ISSUE_TITLE"],
            "text": os.environ["ISSUE_BODY"] + "\n\n" + os.environ["ISSUE_URL"]
          }
          with open("/tmp/email.json", "w") as f:
            json.dump(payload, f)
          result = subprocess.run([
            "curl", "-s", "-w", "\nHTTP_STATUS:%{http_code}",
            "-X", "POST", "https://api.resend.com/emails",
            "-H", f"Authorization: Bearer {os.environ['RESEND_API_KEY']}",
            "-H", "Content-Type: application/json",
            "-d", f"@/tmp/email.json"
          ], capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          EOF
