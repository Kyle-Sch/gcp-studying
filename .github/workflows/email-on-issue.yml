name: Email on New Issue
on:
  issues:
    types: [opened]
jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          payload = {
            "from": "onboarding@resend.dev",
            "to": ["kyle.schne@gmail.com"],
            "subject": f"Daily GCP Practice Questions - {os.environ['ISSUE_TITLE']}",
            "html": f"<h2>{os.environ['ISSUE_TITLE']}</h2><pre style='white-space:pre-wrap'>{os.environ['ISSUE_BODY']}</pre><p><a href='{os.environ['ISSUE_URL']}'>View on GitHub</a></p>"
          }
          data = json.dumps(payload).encode()
          req = urllib.request.Request(
            "https://api.resend.com/emails",
            data=data,
            headers={"Authorization": f"Bearer {os.environ['RESEND_API_KEY']}", "Content-Type": "application/json"},
            method="POST"
          )
          with urllib.request.urlopen(req) as r:
            print(r.status, r.read().decode())
          PYEOF
